# SOLVER - Root Project Configuration
# Workspace configuration for monorepo

[project]
name = "solver"
version = "0.1.0"
description = "SOLVER - Structured Reasoning Workflow Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD"}
authors = [
    {name = "SOLVER Team"}
]

# Root project has no direct dependencies
# Dependencies are managed in individual packages (apps/api, etc.)
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
