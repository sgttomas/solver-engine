name: SOLVER CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "16"

jobs:
  # ==========================================================================
  # API Tests & Type Checking
  # ==========================================================================
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
          POSTGRES_DB: solver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'apps/api/pyproject.toml'

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev,test]"

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
          POSTGRES_DB: solver_test
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests/unit/ -v

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
          POSTGRES_DB: solver_test
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests/integration/ -v

      - name: Generate coverage report
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
          POSTGRES_DB: solver_test
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests/ -v --cov=solver_api --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/api/coverage.xml
          flags: api
          name: api-coverage

  # ==========================================================================
  # Code Quality (Linting & Formatting)
  # ==========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'apps/api/pyproject.toml'

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"

      - name: Run Ruff (lint)
        run: |
          cd apps/api
          ruff check src/ tests/

      - name: Run Ruff (format check)
        run: |
          cd apps/api
          ruff format --check src/ tests/

      - name: Run Mypy (type check)
        run: |
          cd apps/api
          mypy src/solver_api

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for vulnerabilities
        run: |
          cd apps/api
          pip install -e .
          pip freeze | safety check --stdin || true

  # ==========================================================================
  # End-to-End Acceptance Gates (When implemented)
  # ==========================================================================
  e2e:
    name: E2E Tests (Gates A-F)
    runs-on: ubuntu-latest
    if: false  # Enable when E2E tests are implemented

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
          POSTGRES_DB: solver_e2e
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev,test]"

      - name: Run E2E tests
        env:
          POSTGRES_HOST: localhost
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests/e2e/ -v

  # ==========================================================================
  # Status Summary
  # ==========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-api, lint, security]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-api.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ One or more CI checks failed"
            echo "  - Tests: ${{ needs.test-api.result }}"
            echo "  - Lint: ${{ needs.lint.result }}"
            echo "  - Security: ${{ needs.security.result }}"
            exit 1
          fi
          echo "✅ All CI checks passed!"
